plugins {
    id 'com.android.application'
}

// Подпись релиза: если рядом есть key.properties — используется для release.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("key.properties")
if (keystorePropsFile.exists()) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }
def envKeystoreFile = System.getenv("SODESU_KEYSTORE_FILE")
def hasReleaseSigning = keystorePropsFile.exists() || envKeystoreFile
if (!keystorePropsFile.exists() && envKeystoreFile) {
    keystoreProps['storeFile'] = envKeystoreFile
    keystoreProps['storePassword'] = System.getenv("SODESU_KEYSTORE_PASSWORD")
    keystoreProps['keyAlias'] = System.getenv("SODESU_KEY_ALIAS")
    keystoreProps['keyPassword'] = System.getenv("SODESU_KEY_PASSWORD")
}

def versionProps = new Properties()
file("../../version.properties").withInputStream { versionProps.load(it) }
def sodesuVersionName = versionProps.getProperty('VERSION_NAME', '')
if (!(sodesuVersionName ==~ /(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)/)) {
    throw new GradleException('VERSION_NAME must be X.Y.Z in version.properties')
}
def sodesuVersionCode = versionProps.getProperty('VERSION_CODE', '0').toInteger()
def sodesuVersionLabel = versionProps.getProperty('VERSION_LABEL', sodesuVersionName)
if (sodesuVersionCode < 1 || sodesuVersionCode > 2100000000) {
    throw new GradleException('Invalid VERSION_CODE in version.properties')
}

android {
    namespace 'com.genki.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.genki.app"
        minSdk 21
        targetSdk 34
        versionCode sodesuVersionCode
        versionName sodesuVersionName
        resValue "string", "app_version", sodesuVersionName
        resValue "string", "app_version_label", sodesuVersionLabel
        resValue "integer", "app_version_code", sodesuVersionCode.toString()
    }

    // Берём веб-приложение напрямую из ../../www (единый источник, без дублей)
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }

        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        diagnostic {
            initWith release
            applicationIdSuffix '.compat'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            resValue "string", "app_name", "Sodesu Test Build"
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
            else if (providers.gradleProperty('sodesuLegacyBetaSigning').orNull == 'true') {
                // Existing public beta users must retain their original signing certificate.
                // The official builder verifies this certificate against the previous public APK.
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
